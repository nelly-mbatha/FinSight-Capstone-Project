<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight | NSE Predictive Analytics</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        input, button { padding: 10px; margin: 10px; font-size: 16px; }
        .result { margin-top: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <h1>FinSight</h1>
    <p>NSE Short-Term Directional Forecast</p>
    
    <input type="text" id="stockCode" placeholder="Enter Stock Code (e.g., EGAD)">
    <button onclick="getForecast()">Generate Forecast</button>

    <div id="resultBox" class="result">
        <h2 id="direction">Predicted Direction: --</h2>
        <p id="confidence">Model Confidence: --</p>
        <p id="message" style="font-style: italic;"></p>
    </div>

    <script>
        async function getForecast() {
            const stockCode = document.getElementById('stockCode').value.trim().toUpperCase();
            if (!stockCode) {
                alert("Please enter a stock code!");
                return;
            }

            try {
                // Connect to your FastAPI backend
                const response = await fetch('http://127.0.0.1:10000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stock_code: stockCode })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Failed to fetch forecast");
                }

                const data = await response.json();
                
                // Display results
                document.getElementById('direction').innerText = `Predicted Direction: ${data.direction}`;
                document.getElementById('confidence').innerText = `Model Confidence: ${data.confidence}`;
                document.getElementById('message').innerText = data.message;
                document.getElementById('resultBox').style.display = 'block';

            } catch (error) {
                alert(`Error: ${error.message}`);
                document.getElementById('resultBox').style.display = 'none';
            }
        }
    </script>
</body>
</html>
